<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Trial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #ece6f7; --muted: #9a90b3; --line: rgba(255,255,255,.14); --panel: rgba(14,10,22,.92);
      --react: #ff8a1e; --gold: #f1c66e; --pro: #3fd0ea; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
      font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; color: inherit; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
    #stageBox { position: relative; flex: 1; min-height: 0; }
    #stage { position: absolute; inset: 0; }

    /* ---------- the bar ---------- */
    .bar { display: flex; align-items: center; gap: 14px; padding: 10px 14px; flex-wrap: wrap;
      background: linear-gradient(180deg, #0d0915, #07050c); border-top: 1px solid var(--line); }
    .bar[hidden] { display: none; }
    .me { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 10px; text-align: left; }
    .me:hover { background: rgba(255,255,255,.05); }
    .me img { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 0 2px var(--pro); }
    .me b { display: block; font: 700 17px/1.1 Cinzel, Georgia, serif; }
    .me small { color: var(--muted); font-size: 11px; }
    .emotes { display: flex; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; min-width: 0; }
    .emo { position: relative; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: 0; padding: 0; cursor: pointer; }
    .emo .pic { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: #191226;
      border: 2px solid var(--line); display: grid; place-items: center; }
    .emo .pic img { width: 100%; height: 100%; object-fit: contain; }
    .emo .pic img.tok { object-fit: cover; }
    .emo .nm { font-size: 11px; color: var(--muted); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emo.on .pic { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(241,198,110,.35), 0 0 14px rgba(241,198,110,.45); }
    .emo.on .nm { color: var(--gold); }
    .emo.empty .pic { border-style: dashed; color: var(--muted); font-size: 26px; }
    .emo:hover .pic { border-color: rgba(255,255,255,.4); }
    .emo .edit { position: absolute; top: -6px; right: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line);
      background: #241a36; font-size: 12px; display: grid; place-items: center; cursor: pointer; }
    .react { font: 400 26px/1 Anton, Impact, sans-serif; letter-spacing: .05em; color: #fff; cursor: pointer;
      padding: 16px 26px; border-radius: 14px; border: 2px solid #ffd27a; transform: skewX(-8deg);
      background: linear-gradient(180deg, #ffab3d, #e35d00); box-shadow: 0 6px 0 #7a2c00, 0 0 24px rgba(255,138,30,.4);
      text-shadow: 0 2px 0 #7a2c00; transition: transform .08s, box-shadow .08s, filter .2s; }
    .react:active { transform: skewX(-8deg) translateY(4px); box-shadow: 0 2px 0 #7a2c00; }
    .react:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
    .react .why, .speak .why { display: block; font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .04em; text-shadow: none; margin-top: 4px; }
    .react .why.listen, .speak .why.listen { font: 400 13px/1 Anton, Impact, sans-serif; letter-spacing: .22em; color: #ffe2a3; }
    .acts.listen { position: relative; }
    .acts.listen::before { content: 'THE JUDGE ASKS YOU TO LISTEN'; position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%);
      white-space: nowrap; padding: 5px 12px; border-radius: 10px; background: #0d0915; border: 1px solid rgba(255,226,163,.45);
      font: 400 12px/1 Anton, Impact, sans-serif; letter-spacing: .18em; color: #ffe2a3; pointer-events: none; z-index: 3; }
    .speak { font: 400 26px/1 Anton, Impact, sans-serif; letter-spacing: .05em; color: #fff; cursor: pointer;
      padding: 16px 26px; border-radius: 14px; border: 2px solid #9eefff; transform: skewX(-8deg);
      background: linear-gradient(180deg, #46d6f0, #0a7f9e); box-shadow: 0 6px 0 #04394a, 0 0 22px rgba(63,208,234,.35);
      text-shadow: 0 2px 0 #04394a; transition: transform .08s, box-shadow .08s, filter .2s; }
    .speak:active { transform: skewX(-8deg) translateY(4px); box-shadow: 0 2px 0 #04394a; }
    .speak:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
    .acts { display: flex; gap: 12px; align-items: center; }
    .tools button.on { border-color: var(--gold); color: var(--gold); }

    /* ---------- who sides with whom (around the stage) ---------- */
    .tracker { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .tracker[hidden] { display: none; }
    .lane { position: absolute; }
    .lane.def { background: linear-gradient(90deg, rgba(226,70,92,.05), rgba(226,70,92,.12)); box-shadow: inset -2px 0 0 rgba(226,70,92,.55); }
    .lane.pro { background: linear-gradient(270deg, rgba(63,208,234,.05), rgba(63,208,234,.12)); box-shadow: inset 2px 0 0 rgba(63,208,234,.55); }
    .lane.jury { background: linear-gradient(180deg, rgba(231,181,77,.04), rgba(231,181,77,.11)); box-shadow: inset 0 -2px 0 rgba(231,181,77,.55); }
    .th { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; }
    .th b { font: 400 var(--hf, 17px)/1 Anton, Impact, sans-serif; letter-spacing: .1em; transform: skewX(-8deg); white-space: nowrap; }
    .th span { font: 700 calc(var(--hf, 17px) * 1.25)/1 Cinzel, Georgia, serif; color: #fff; }
    .th.def b { color: #ff7d92; } .th.pro b { color: #7fe6f7; } .th.jury b { color: #f3cc78; }
    .th.jury { flex-direction: row; gap: 8px; }
    .tk { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; opacity: 0;
      transition: transform 1.1s cubic-bezier(.3,.85,.25,1), opacity .45s; will-change: transform; }
    .tk.in { opacity: 1; }
    .tk .f { width: var(--d); height: var(--d); border-radius: 50%; overflow: hidden; background: #1a1426;
      box-shadow: 0 0 0 2px var(--c), 0 3px 10px rgba(0,0,0,.65); transition: width .4s, height .4s, box-shadow .6s; }
    .tk .f img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tk .f img.headcrop { object-position: 50% 0; transform: scale(1.9) translateY(22%); }
    .tk .n { margin-top: 3px; font: 700 10.5px/1.1 Cinzel, Georgia, serif; color: #e9e2f5; max-width: 100%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
    .tk.nolab .n { display: none; }
    .tk.wv .f { animation: tkWaver 1.9s linear infinite; animation-delay: var(--wd, 0s);
      box-shadow: 0 0 0 2px var(--c), 0 0 0 4px rgba(241,198,110,.55), 0 0 14px 3px rgba(241,198,110,.55); }
    @keyframes tkWaver { 0%, 46%, 100% { transform: none } 49% { transform: translateX(-3px) rotate(-6deg) } 52% { transform: translateX(3px) rotate(5deg) }
      55% { transform: translateX(-2.5px) rotate(-4deg) } 58% { transform: translateX(2.5px) rotate(4deg) } 61% { transform: translateX(-2px) rotate(-3deg) }
      64% { transform: translateX(2px) rotate(2deg) } 68% { transform: translateX(-1px) } 72% { transform: none } }
    .tools { display: flex; gap: 6px; }
    .tools button { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
    .watch { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }

    /* ---------- who are you? ---------- */
    .picker { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 16px; text-align: center; overflow: auto;
      background: radial-gradient(ellipse at 50% 40%, rgba(32,15,52,.94), rgba(3,2,6,.98)); }
    .picker[hidden] { display: none; }
    .picker h1 { margin: 0; font: 400 clamp(46px, 10vw, 120px)/1 Anton, Impact, sans-serif; color: var(--gold);
      letter-spacing: .05em; transform: skewX(-8deg); text-shadow: 6px 6px 0 #3b0d2a; }
    .picker p { margin: 0; font: 600 clamp(16px, 2.4vw, 22px)/1.2 Cinzel, Georgia, serif; letter-spacing: .12em; }
    .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .card { width: 128px; padding: 14px 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.04);
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .12s, border-color .12s; }
    .card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--gold); }
    .card img { width: 86px; height: 86px; border-radius: 50%; }
    .card b { font: 700 16px/1 Cinzel, Georgia, serif; }
    .card small { color: var(--muted); font-size: 11px; min-height: 14px; }
    .card:disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.8); }
    .card.mine { border-color: var(--pro); box-shadow: 0 0 0 2px rgba(63,208,234,.35); }
    .picker .fine { color: var(--muted); font-size: 12px; max-width: 520px; }

    /* ---------- emote editor ---------- */
    .editor { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.66); }
    .editor[hidden] { display: none; }
    .sheet { width: min(440px, 100%); background: #140e1f; border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
    .sheet h2 { margin: 0; font: 700 20px/1.1 Cinzel, Georgia, serif; }
    .sheet label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    .sheet input[type=text] { background: #0b0812; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .drop { border: 2px dashed var(--line); border-radius: 12px; min-height: 200px; display: grid; place-items: center; cursor: pointer;
      background: #0b0812 repeating-conic-gradient(#120d1b 0 25%, #0b0812 0 50%) 0 0 / 20px 20px; position: relative; overflow: hidden; }
    .drop.over { border-color: var(--gold); }
    .drop img { max-width: 100%; max-height: 260px; display: block; }
    .drop span { color: var(--muted); padding: 20px; }
    .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .row button { border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; }
    .row .save { background: var(--gold); color: #1a1205; border-color: var(--gold); font-weight: 700; }
    .row .del { margin-right: auto; color: #ff9a9a; }
    .err { color: #ff9a9a; font-size: 12px; min-height: 14px; }

    .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 40; background: rgba(10,8,14,.92);
      border: 1px solid var(--line); padding: 9px 14px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .toast.on { opacity: 1; }
    .conn { position: fixed; left: 12px; top: 12px; z-index: 5; font: 600 12px system-ui, sans-serif; color: #ffb3b3;
      background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 14px; display: none; }
    @media (max-width: 720px) {
      .bar { gap: 10px; padding: 8px 10px; }
      .me img { width: 40px; height: 40px; }
      .emo { width: 56px; } .emo .pic { width: 50px; height: 50px; }
      .react, .speak { font-size: 20px; padding: 12px 16px; }
      .acts { flex: 1; } .acts button { flex: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stageBox">
      <div id="stage"></div>
      <div class="tracker" id="tracker" hidden>
        <div class="lane def" id="laneDef"></div><div class="lane pro" id="lanePro"></div><div class="lane jury" id="laneJury"></div>
        <div class="th def" id="thDef"><b>DEFENSE</b><span></span></div>
        <div class="th pro" id="thPro"><b>PROSECUTION</b><span></span></div>
        <div class="th jury" id="thJury"><b>JURY</b><span></span></div>
      </div>
    </div>
    <footer class="bar" id="bar" hidden>
      <button class="me" id="me" title="Change character"></button>
      <div class="emotes" id="emotes"></div>
      <div class="acts" id="acts">
        <button class="speak" id="speak" title="Take the floor: the camera comes to you">SPEAK</button>
        <button class="react" id="react" title="Interrupt: the camera comes to you with a REACTION! banner">REACTION!</button>
      </div>
      <div class="tools">
        <button id="trk" title="Who sides with whom (T)">⚖</button>
        <button id="snd" title="Sound">🔊</button>
        <button id="fs" title="Full screen (F)">⛶</button>
      </div>
    </footer>
  </div>

  <div class="picker" id="picker">
    <h1>CLASS TRIAL</h1>
    <p>Who are you?</p>
    <div class="cards" id="cards"></div>
    <button class="watch" id="watch">Just watch</button>
    <div class="fine">Your choice is kept on this device. Each character can only be taken once; ask the GM if yours is taken by mistake.</div>
  </div>

  <div class="editor" id="editor" hidden>
    <form class="sheet" id="sheet">
      <h2 id="edTitle">Emote</h2>
      <label>Name
        <input type="text" id="edName" maxlength="24" placeholder="e.g. Angry, Smug, Shocked…" autocomplete="off">
      </label>
      <label>Picture <span style="font-size:11px">— a PNG with a transparent background looks best; it is shrunk before sending</span>
        <div class="drop" id="drop" tabindex="0"><span>Click or drop an image here</span></div>
        <input type="file" id="edFile" accept="image/png,image/webp,image/jpeg,image/gif" hidden>
      </label>
      <div class="err" id="edErr"></div>
      <div class="row">
        <button type="button" class="del" id="edDel">Remove</button>
        <button type="button" id="edCancel">Cancel</button>
        <button type="submit" class="save" id="edSave">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
  <div class="conn" id="conn">Reconnecting…</div>

  <script src="/trial_core.js"></script>
  <script src="/trial_stage.js"></script>
  <script>
  (function () {
    'use strict';
    const C = window.TrialCore;
    const $ = (s) => document.querySelector(s);
    let shown = {};          // the seats as the stage shows them: a side change lands in the tracker when the walk starts
    const stage = new TrialStage($('#stage'), { sound: true, assets: '/', onLayout: (slots) => { shown = slots; placeTokens(); } });

    /* this browser's player id — never shown, only sent with our own actions */
    let cid = null;
    try { cid = localStorage.getItem('m1_trial_cid'); } catch (e) {}
    if (!C.validCid(cid)) {
      cid = Array.from(crypto.getRandomValues(new Uint8Array(18))).map((b) => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
      try { localStorage.setItem('m1_trial_cid', cid); } catch (e) {}
    }
    let watching = false;
    try { watching = localStorage.getItem('m1_trial_watch') === '1'; } catch (e) {}

    let state = null, rev = null, busy = false, fails = 0, cooldownUntil = 0, speakUntil = 0;
    const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400); };

    async function poll() {
      if (busy) return;
      busy = true;
      try {
        const r = await fetch('/trial/state?cid=' + encodeURIComponent(cid), { cache: 'no-store' });
        const j = await r.json();
        fails = 0; $('#conn').style.display = 'none';
        if (j.rev !== rev) { rev = j.rev; state = j; stage.setState(j); paint(); }
      } catch (e) {
        if (++fails > 8) $('#conn').style.display = 'block';
      } finally { busy = false; }
    }
    async function play(a) {
      try {
        const r = await fetch('/trial/play', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ cid }, a)) });
        const j = await r.json();
        if (j.state && j.state.rev !== rev) { rev = j.state.rev; state = j.state; stage.setState(state); paint(); }
        if (!j.ok && j.error) toast(j.error.charAt(0).toUpperCase() + j.error.slice(1) + '.');
        return j;
      } catch (e) { toast('Could not reach the table — try again.'); return { ok: false }; }
    }
    setInterval(poll, 250);
    poll();

    const pcs = C.CAST.filter((c) => c.group === 'pc');
    const tokenSrc = (c) => '/tokens/' + encodeURIComponent(c.token);

    /* ---------- painting ---------- */
    function paint() {
      if (!state) return;
      const P = state.players || {};
      const mine = P.mine;
      if (mine) watching = false;
      // picker
      $('#picker').hidden = !!mine || watching;
      const cards = $('#cards');
      if (!cards.children.length) {
        pcs.forEach((c) => {
          const b = document.createElement('button');
          b.className = 'card'; b.dataset.key = c.key;
          b.innerHTML = '<img alt="" src="' + tokenSrc(c) + '"><b>' + c.name + '</b><small></small>';
          b.onclick = () => choose(c.key);
          cards.appendChild(b);
        });
      }
      Array.from(cards.children).forEach((b) => {
        const k = b.dataset.key, taken = (P.taken || []).indexOf(k) >= 0 && k !== mine;
        b.disabled = taken;
        b.classList.toggle('mine', k === mine);
        b.querySelector('small').textContent = k === mine ? 'you' : taken ? 'taken' : '';
      });
      // bar
      const bar = $('#bar');
      bar.hidden = !mine && !watching;
      const c = mine && C.BY_KEY[mine];
      $('#me').innerHTML = c ? '<img alt="" src="' + tokenSrc(c) + '"><span><b>' + c.name + '</b><small>change character</small></span>'
        : '<span><b>Watching</b><small>pick a character</small></span>';
      $('#emotes').style.display = c ? '' : 'none';
      $('#acts').style.display = c ? '' : 'none';
      if (c) paintEmotes(c, P);
      paintButtons();
      layout();
    }
    /* SPEAK = take the floor (camera only). REACTION = interrupt (camera + banner).
       The GM can switch either off: both off = "listen". */
    function paintButtons() {
      if (!state) return;
      const P = state.players || {};
      const listen = P.speak === false && P.react === false;
      const seated = !!state.open && Object.keys(state.slots || {}).some((sid) => state.slots[sid] === P.mine);
      const now = Date.now();
      const whyS = !state.open ? 'court not in session' : P.speak === false ? 'listen' : !seated ? 'not in the courtroom' : now < speakUntil ? '…' : '';
      const whyR = !state.open ? 'court not in session' : P.react === false ? (listen ? 'listen' : 'reactions are off') : now < cooldownUntil ? '…' : '';
      $('#acts').classList.toggle('listen', listen && !!state.open);
      const set = (b, label, why) => {
        b.disabled = !!why;
        const html = label + (why && why !== '…' ? '<span class="why' + (why === 'listen' ? ' listen' : '') + '">' + why + '</span>' : '');
        if (b._html !== html) { b._html = html; b.innerHTML = html; }
      };
      set($('#speak'), 'SPEAK', whyS);
      set($('#react'), 'REACTION!', whyR);
    }

    /* ---------- who sides with whom ----------
       The Primes' tokens around the stage: the defense in the left strip, the
       prosecution in the right one, the jury along the top. The stage keeps its
       16:9 shape in the middle. Trembling tokens = wavering jurors. */
    let trackOn = true;
    try { trackOn = localStorage.getItem('m1_trial_tracker') !== '0'; } catch (e) {}
    let geo = null;
    const tks = {};
    const SIDE_C = { defense: '#e2465c', jury: '#e7b54d', prosecution: '#3fd0ea' };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function layout() {
      const box = $('#stageBox'), sEl = $('#stage');
      const W = box.clientWidth, H = box.clientHeight;
      const on = trackOn && !!state && !!state.open;
      $('#tracker').hidden = !on;
      $('#trk').classList.toggle('on', trackOn);
      if (!on || !W || !H) {
        if (geo) { geo = null; sEl.removeAttribute('style'); }
        placeTokens();
        return;
      }
      const S = Math.round(clamp(W * 0.07, 62, 130)), T = Math.round(clamp(H * 0.11, 52, 90));
      const w = Math.floor(Math.max(160, Math.min(W - 2 * S, (H - T) * 16 / 9)));
      const h = Math.floor(w * 9 / 16);
      const top = Math.max(0, Math.round((H - T - h) / 2)), left = Math.round((W - w) / 2);
      const sig = [W, H, w, h, top, left, T].join();
      if (!geo || geo.sig !== sig) {
        Object.assign(sEl.style, { left: left + 'px', top: (top + T) + 'px', width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto' });
        const put = (id, x, y, ww, hh) => Object.assign($(id).style, { left: x + 'px', top: y + 'px', width: Math.max(0, ww) + 'px', height: Math.max(0, hh) + 'px' });
        put('#laneDef', 0, top + T, left, h);
        put('#lanePro', left + w, top + T, W - left - w, h);
        put('#laneJury', left, top, w, T);
        put('#thDef', 0, top, left, T);
        put('#thPro', left + w, top, W - left - w, T);
        // "PROSECUTION" must fit its strip: the header size follows the strip's width
        const hf = Math.round(clamp((Math.min(left, W - left - w) - 12) / 7.4, 10, 19)) + 'px';
        $('#thDef').style.setProperty('--hf', hf); $('#thPro').style.setProperty('--hf', hf);
        Object.assign($('#thJury').style, { left: (left + 14) + 'px', top: top + 'px', height: T + 'px', width: 'auto' });
      }
      geo = { sig, W, H, T, w, h, top, left, right: left + w };
      placeTokens();
    }
    function placeTokens() {
      const lists = { defense: [], jury: [], prosecution: [] };
      const order = C.LINE.filter((sid) => sid[0] !== 'R').concat(C.LINE.filter((sid) => sid[0] === 'R').reverse());
      order.forEach((sid) => {
        const k = shown[sid], c = k && C.BY_KEY[k];
        if (c && c.group === 'prime' && lists[C.SLOT[sid].side]) lists[C.SLOT[sid].side].push(k);
      });
      $('#thDef span').textContent = lists.defense.length;
      $('#thPro span').textContent = lists.prosecution.length;
      $('#thJury span').textContent = lists.jury.length;
      const want = {};
      if (geo) {
        column(lists.defense, 0, geo.left, 'defense', want);
        column(lists.prosecution, geo.right, geo.W - geo.right, 'prosecution', want);
        row(lists.jury, want);
      }
      const wv = (state && state.open && state.waver) || {};
      Object.keys(want).forEach((k) => {
        const p = want[k];
        let t = tks[k];
        const tf = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)';
        if (!t || t._gone) {
          if (t) t.remove();
          t = tks[k] = makeTk(k);
          t.style.transition = 'none';
          t.style.transform = tf;
          $('#tracker').appendChild(t);
          void t.offsetWidth;
          t.style.transition = '';
        }
        t.style.width = p.w.toFixed(1) + 'px';
        t.style.setProperty('--d', p.d + 'px');
        t.style.setProperty('--c', SIDE_C[p.side]);
        t.classList.toggle('nolab', !p.lab);
        if (t._tf !== tf) { t._tf = tf; t.style.transform = tf; }
        t.classList.add('in');
        const w = !!wv[k];
        if (t._wv !== w) { t._wv = w; t.style.setProperty('--wd', (-Math.random() * 1.9).toFixed(2) + 's'); t.classList.toggle('wv', w); }
      });
      Object.keys(tks).forEach((k) => {
        const t = tks[k];
        if (want[k] || t._gone) return;
        t._gone = true;
        t.classList.remove('in');
        setTimeout(() => { if (tks[k] === t && t._gone) { t.remove(); delete tks[k]; } }, 500);
      });
    }
    function makeTk(k) {
      const c = C.BY_KEY[k];
      const t = document.createElement('div');
      t.className = 'tk';
      t.title = c.name;
      t.innerHTML = '<div class="f"><img alt=""></div><div class="n"></div>';
      const img = t.querySelector('img');
      img.src = tokenSrc(c);
      img.onerror = () => { img.onerror = null; img.classList.add('headcrop'); img.src = '/sprites/' + k + '.webp'; };
      t.querySelector('.n').textContent = c.name;
      return t;
    }
    // a side strip: one column of tokens, two or three when there are many
    function column(list, x0, cw, side, want) {
      const n = list.length;
      if (!n) return;
      const ch = geo.h - 14, y0 = geo.top + geo.T + 10;
      let best = null;
      for (let k = 1; k <= 3; k++) {
        const rows = Math.ceil(n / k), cellW = (cw - 12) / k;
        for (const lab of [15, 0]) {
          const d = Math.floor(Math.min(64, cellW - 8, ch / rows - lab - 8));
          if (lab && d < 36) continue;
          if (!best || d > best.d + 3) best = { k, cellW, d, lab };
          break;
        }
      }
      const cellH = best.d + best.lab + 8;
      list.forEach((key, i) => {
        const col = i % best.k, r = Math.floor(i / best.k);
        want[key] = { x: x0 + 6 + col * best.cellW, y: y0 + r * cellH, w: best.cellW, d: Math.max(18, best.d), lab: !!best.lab, side };
      });
    }
    // the jury strip: one line, like the jury on stage
    function row(list, want) {
      const n = list.length;
      if (!n) return;
      const lw = $('#thJury').offsetWidth + 26;
      const x0 = geo.left + lw, aw = geo.w - lw - 14;
      const lab = geo.T >= 72 ? 14 : 0;
      const d = Math.max(18, Math.floor(Math.min(64, geo.T - 12 - lab, aw / n - 12)));
      const cellW = Math.min(aw / n, d + 40);
      const xs = x0 + (aw - cellW * n) / 2;
      list.forEach((key, i) => {
        want[key] = { x: xs + i * cellW, y: geo.top + (geo.T - d - lab) / 2 - 1, w: cellW, d, lab: !!lab, side: 'jury' };
      });
    }
    new ResizeObserver(() => layout()).observe($('#stageBox'));
    $('#trk').onclick = () => {
      trackOn = !trackOn;
      try { localStorage.setItem('m1_trial_tracker', trackOn ? '1' : '0'); } catch (e) {}
      layout();
    };
    function paintEmotes(c, P) {
      const box = $('#emotes');
      const on = (P.emoteOn || {})[c.key] || 1;
      const list = (P.emotes || {})[c.key] || [];
      const sig = JSON.stringify([c.key, on, list]);
      if (box._sig === sig) return;          // only rebuild when something changed
      box._sig = sig;
      box.innerHTML = '';
      [1, 2, 3, 4, 5].forEach((n) => {
        const meta = list.find((e) => e.n === n);
        const b = document.createElement('div');
        b.className = 'emo' + (n === on ? ' on' : '') + (n > 1 && !meta ? ' empty' : '');
        b.setAttribute('role', 'button'); b.tabIndex = 0;
        let pic;
        if (n === 1) pic = '<img class="tok" alt="" src="' + tokenSrc(c) + '">';
        else if (meta) pic = '<img alt="" src="/trial/emote/' + c.key + '/' + n + '?v=' + meta.ver + '">';
        else pic = '+';
        b.innerHTML = '<div class="pic">' + pic + '</div><div class="nm">' + (n === 1 ? 'Default' : meta ? esc(meta.name || 'Emote ' + n) : 'Add emote') + '</div>'
          + (meta ? '<button class="edit" title="Edit">✎</button>' : '');
        b.onclick = (e) => {
          if (e.target.closest('.edit') || (n > 1 && !meta)) return openEditor(n, meta);
          if (n !== on) play({ action: 'emote', n });
        };
        box.appendChild(b);
      });
    }
    const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

    /* ---------- choosing ---------- */
    async function choose(key) {
      window.TrialSFX.unlock();
      watching = false;
      try { localStorage.removeItem('m1_trial_watch'); } catch (e) {}
      await play({ action: 'claim', key });
    }
    $('#watch').onclick = () => {
      window.TrialSFX.unlock();
      watching = true;
      try { localStorage.setItem('m1_trial_watch', '1'); } catch (e) {}
      paint();
    };
    $('#me').onclick = async () => {
      if (state.players.mine) await play({ action: 'unclaim' });
      watching = false;
      try { localStorage.removeItem('m1_trial_watch'); } catch (e) {}
      $('#picker').hidden = false;
    };
    $('#react').onclick = async () => {
      cooldownUntil = Date.now() + C.REACT_COOLDOWN;
      paintButtons();
      setTimeout(paintButtons, C.REACT_COOLDOWN + 50);
      await play({ action: 'react' });
    };
    $('#speak').onclick = async () => {
      speakUntil = Date.now() + C.SPEAK_COOLDOWN;
      paintButtons();
      setTimeout(paintButtons, C.SPEAK_COOLDOWN + 50);
      await play({ action: 'speak' });
    };

    /* ---------- emote editor ---------- */
    let edN = 0, edData = null;
    function openEditor(n, meta) {
      edN = n; edData = null;
      $('#edTitle').textContent = 'Emote ' + n;
      $('#edName').value = meta ? meta.name : '';
      $('#edErr').textContent = '';
      $('#edDel').style.display = meta ? '' : 'none';
      $('#drop').innerHTML = meta ? '<img alt="" src="/trial/emote/' + state.players.mine + '/' + n + '?v=' + meta.ver + '">' : '<span>Click or drop an image here</span>';
      $('#editor').hidden = false;
      $('#edName').focus();
    }
    const closeEditor = () => { $('#editor').hidden = true; };
    $('#edCancel').onclick = closeEditor;
    $('#editor').addEventListener('click', (e) => { if (e.target.id === 'editor') closeEditor(); });
    $('#drop').onclick = () => $('#edFile').click();
    $('#drop').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#edFile').click(); } });
    $('#drop').addEventListener('dragover', (e) => { e.preventDefault(); $('#drop').classList.add('over'); });
    $('#drop').addEventListener('dragleave', () => $('#drop').classList.remove('over'));
    $('#drop').addEventListener('drop', (e) => { e.preventDefault(); $('#drop').classList.remove('over'); if (e.dataTransfer.files[0]) take(e.dataTransfer.files[0]); });
    $('#edFile').onchange = (e) => { if (e.target.files[0]) take(e.target.files[0]); e.target.value = ''; };

    /* Shrink the picture in the browser before sending: trim transparent edges,
       at most 900 px, WebP (keeps transparency). */
    function take(file) {
      $('#edErr').textContent = '';
      if (!/^image\//.test(file.type)) { $('#edErr').textContent = 'That is not a picture.'; return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const x = cv.getContext('2d'); x.drawImage(img, 0, 0);
        // trim fully transparent borders
        let bx0 = 0, by0 = 0, bx1 = w, by1 = h;
        try {
          const d = x.getImageData(0, 0, w, h).data;
          let minX = w, minY = h, maxX = -1, maxY = -1;
          for (let yy = 0; yy < h; yy += 2) for (let xx = 0; xx < w; xx += 2) {
            if (d[(yy * w + xx) * 4 + 3] > 16) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; }
          }
          if (maxX >= 0) { bx0 = Math.max(0, minX - 2); by0 = Math.max(0, minY - 2); bx1 = Math.min(w, maxX + 3); by1 = Math.min(h, maxY + 3); }
        } catch (e) {}
        const cw = bx1 - bx0, ch = by1 - by0;
        const k = Math.min(1, 900 / Math.max(cw, ch));
        const out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(cw * k)); out.height = Math.max(1, Math.round(ch * k));
        out.getContext('2d').drawImage(cv, bx0, by0, cw, ch, 0, 0, out.width, out.height);
        let data = out.toDataURL('image/webp', 0.88);
        if (data.indexOf('data:image/webp') !== 0) data = out.toDataURL('image/png');
        if (data.length > 1150000) data = out.toDataURL('image/jpeg', 0.85);
        edData = data;
        $('#drop').innerHTML = '<img alt="" src="' + data + '">';
        if (!$('#edName').value) $('#edName').value = file.name.replace(/\.[^.]+$/, '').slice(0, 24);
        URL.revokeObjectURL(url);
      };
      img.onerror = () => { $('#edErr').textContent = 'This picture could not be read.'; };
      img.src = url;
    }
    $('#sheet').onsubmit = async (e) => {
      e.preventDefault();
      const name = $('#edName').value.trim() || ('Emote ' + edN);
      const meta = ((state.players.emotes || {})[state.players.mine] || []).find((m) => m.n === edN);
      if (!edData && !meta) { $('#edErr').textContent = 'Choose a picture first.'; return; }
      $('#edSave').disabled = true;
      const r = edData ? await play({ action: 'emoteSave', n: edN, name, data: edData, wear: true })
                       : await play({ action: 'emoteName', n: edN, name });
      $('#edSave').disabled = false;
      if (r.ok) closeEditor(); else $('#edErr').textContent = r.error || 'Not saved.';
    };
    $('#edDel').onclick = async () => { await play({ action: 'emoteDelete', n: edN }); closeEditor(); };

    /* ---------- sound & full screen ---------- */
    const snd = $('#snd');
    const paintSnd = () => { snd.textContent = window.TrialSFX.enabled ? '🔊' : '🔇'; };
    snd.onclick = () => { if (!window.TrialSFX.ctx) window.TrialSFX.unlock(); else window.TrialSFX.enabled = !window.TrialSFX.enabled; paintSnd(); };
    const toggleFs = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    };
    $('#fs').onclick = toggleFs;
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea')) return;
      if (e.key === 'f' || e.key === 'F') toggleFs();
      if (e.key === 't' || e.key === 'T') $('#trk').click();
      if (e.key === 'Escape') closeEditor();
    });
    // one click anywhere unlocks sound (browsers require it)
    document.addEventListener('pointerdown', () => { if (!window.TrialSFX.ctx) { window.TrialSFX.unlock(); paintSnd(); } }, { once: true });
  })();
  </script>
</body>
