<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>The Hourglass</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    /* ---------- Class Trial invitation: time stops, JOIN CLASS TRIAL ---------- */
    .tstop { position: fixed; inset: 0; z-index: 6; pointer-events: none; visibility: hidden; }
    .tstop.on { visibility: visible; }
    .tst-veil { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease-out;
      background: radial-gradient(ellipse at 50% 46%, rgba(60,20,110,.06) 0%, rgba(34,10,60,.5) 52%, rgba(6,2,14,.9) 100%); }
    .tstop.on .tst-veil { opacity: 1; }
    .tst-at { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
    .tst-ring { position: absolute; left: 0; top: 0; width: 70vmax; height: 70vmax; border-radius: 50%;
      border: 3px solid rgba(220,190,255,.95); box-shadow: 0 0 40px rgba(180,140,255,.75), inset 0 0 50px rgba(180,140,255,.5);
      transform: translate(-50%, -50%) scale(0); opacity: 0; }
    .tstop.intro .tst-ring { animation: tstRing 1.15s cubic-bezier(.12,.7,.3,1) forwards; }
    .tstop.intro .tst-ring.r2 { animation-delay: .2s; border-color: rgba(241,198,110,.9); }
    @keyframes tstRing { 0% { transform: translate(-50%, -50%) scale(.02); opacity: 1 } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0 } }
    .tst-box { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .tst-await { font: 700 clamp(12px, 1.5vw, 17px)/1 'Cinzel', Georgia, serif; letter-spacing: .42em; padding-left: .42em; color: #eadbff;
      text-shadow: 0 2px 8px #000, 0 0 18px rgba(150,90,255,.6); white-space: nowrap; }
    .tst-join { pointer-events: auto; display: block; white-space: nowrap; text-decoration: none; cursor: pointer;
      font: 400 clamp(26px, 4.4vw, 56px)/1 'Anton', Impact, 'Arial Black', sans-serif; letter-spacing: .06em; color: #f7d684;
      padding: .36em .9em .42em; border-radius: 14px; border: 3px solid #f1c66e; transform: skewX(-8deg);
      background: linear-gradient(180deg, #55209a, #2a1150); text-shadow: 3px 3px 0 #3b0d2a;
      box-shadow: 0 8px 0 #160828, 0 0 26px rgba(241,198,110,.4), 0 0 70px rgba(150,90,255,.35);
      animation: tstPulse 2.4s ease-in-out infinite; }
    .tst-join:hover { filter: brightness(1.18); }
    .tst-join:active { transform: skewX(-8deg) translateY(5px); box-shadow: 0 3px 0 #160828; }
    @keyframes tstPulse { 0%, 100% { box-shadow: 0 8px 0 #160828, 0 0 26px rgba(241,198,110,.4), 0 0 70px rgba(150,90,255,.35) }
      50% { box-shadow: 0 8px 0 #160828, 0 0 40px rgba(241,198,110,.75), 0 0 120px rgba(150,90,255,.6) } }
    .tstop.intro .tst-join { animation: tstSlam .5s cubic-bezier(.2,1.5,.4,1) 1.2s both, tstPulse 2.4s ease-in-out 1.8s infinite; }
    .tstop.intro .tst-await { animation: tstFade .8s ease-out 1.65s both; }
    @keyframes tstSlam { from { transform: skewX(-8deg) scale(2.8); opacity: 0; filter: blur(10px) } to { transform: skewX(-8deg) scale(1); opacity: 1; filter: none } }
    @keyframes tstFade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    /* the room while time stands still: the glass goes grey, the sand hangs in the air */
    .player-page .hg-frame .frame-img { transition: filter 1.4s; }
    .player-page.frozen .hg-frame .frame-img { filter: drop-shadow(0 18px 44px rgba(0,0,0,.6)) saturate(.25) brightness(.78) contrast(1.08); }
    #sandG.frozen #particles circle { fill: #fff4d6; animation: tstGlint 1.4s ease-in-out infinite alternate; }
    #sandG.frozen #stream { fill: #fff0c8; opacity: .85; }
    @keyframes tstGlint { from { opacity: .45 } to { opacity: 1 } }
    .player-page.frozen .digital { color: #dccbff; text-shadow: 0 0 16px rgba(170,120,255,.65), 0 2px 4px rgba(0,0,0,.7); }
    .player-page.frozen .paused-badge { color: #eadbff; letter-spacing: 5px; }
    .player-page.shake { animation: pShake .65s linear; }
    @keyframes pShake { 0% { transform: none } 12% { transform: translate(-10px, 6px) } 24% { transform: translate(9px, -7px) } 36% { transform: translate(-7px, -4px) }
      50% { transform: translate(6px, 5px) } 65% { transform: translate(-4px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: none } }
    .flash.violet { background: #d2b4ff; }
    .flash.violet.go { animation: flashV .9s ease-out; }
    @keyframes flashV { 0% { opacity: .85 } 100% { opacity: 0 } }
  </style>
</head>
<body>
  <div class="player-page" id="page">
    <button class="sound-btn" id="soundBtn">🔔 Enable sound</button>

    <!-- Horloge de la Citadelle : l'heure « en jeu », calée sur le sablier (09:00 → 10:00) -->
    <div class="med-clock" id="medClock" title="Citadel time">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="mcFace" cx="38%" cy="30%" r="78%">
            <stop offset="0%" stop-color="#3a2a15"/>
            <stop offset="55%" stop-color="#241809"/>
            <stop offset="100%" stop-color="#140d05"/>
          </radialGradient>
          <linearGradient id="mcBrass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6dfa4"/>
            <stop offset="38%" stop-color="#c9973f"/>
            <stop offset="62%" stop-color="#8a6220"/>
            <stop offset="100%" stop-color="#e2c179"/>
          </linearGradient>
          <linearGradient id="mcHand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe9b8"/>
            <stop offset="100%" stop-color="#c08c30"/>
          </linearGradient>
          <filter id="mcGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- couronne de laiton + rivets -->
        <circle cx="100" cy="100" r="96" fill="url(#mcBrass)"/>
        <circle cx="100" cy="100" r="87" fill="#150e06"/>
        <circle cx="100" cy="100" r="83" fill="url(#mcBrass)"/>
        <circle cx="100" cy="100" r="78" fill="url(#mcFace)"/>
        <g id="mcRivets" fill="#f2d99e" opacity=".85"></g>
        <!-- graduations + chiffres romains (generes au chargement) -->
        <g id="mcTicks" stroke="#d9b874" stroke-linecap="round"></g>
        <g id="mcNums" fill="#e8c37a" font-family="Georgia,'Times New Roman',serif"
           font-size="13" font-weight="700" text-anchor="middle"></g>

        <!-- aiguilles -->
        <g filter="url(#mcGlow)">
          <!-- aiguille des heures : courte et large, style gothique -->
          <g class="mc-hand" id="mcHourHand">
            <path d="M100 110 L91 90 L100 52 L109 90 Z" fill="url(#mcHand)" stroke="#4a3210" stroke-width="1.8"
                  stroke-linejoin="round"/>
            <circle cx="100" cy="82" r="6.5" fill="#241809" stroke="#4a3210" stroke-width="1.6"/>
          </g>
          <!-- aiguille des minutes : longue, pointe en fleur de lys -->
          <g class="mc-hand" id="mcMinHand">
            <path d="M100 112 L95 92 L100 30 L105 92 Z" fill="url(#mcHand)" stroke="#4a3210" stroke-width="1.6"
                  stroke-linejoin="round"/>
            <path d="M100 14 L106 30 L100 36 L94 30 Z" fill="url(#mcHand)" stroke="#4a3210" stroke-width="1.6"
                  stroke-linejoin="round"/>
          </g>
        </g>
        <circle cx="100" cy="100" r="7" fill="url(#mcBrass)" stroke="#5c3f12" stroke-width="1.2"/>
        <circle cx="100" cy="100" r="2.4" fill="#3a2a12"/>
      </svg>
      <div class="mc-time" id="mcTime">09:00</div>
    </div>

    <div class="stage">
      <div class="hg-frame" id="hgFrame">
        <svg class="sand" id="sand" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="382" x2="0" y2="1135">
              <stop offset="0%"  stop-color="#ffe6a6"/>
              <stop offset="45%" stop-color="#f2b74e"/>
              <stop offset="100%" stop-color="#bd7822"/>
            </linearGradient>
            <filter id="sglow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="sandG" filter="url(#sglow)">
            <path id="sandTop" fill="url(#amber)" d=""/>
            <path id="sandBot" fill="url(#amber)" d=""/>
            <rect id="stream" x="509" y="769" width="6" height="0" fill="#ffd77a"/>
            <g id="particles"></g>
          </g>
        </svg>
        <img class="frame-img" src="/frame_hourglass.png" alt="Sablier" draggable="false">
      </div>
      <div class="digital" id="clock">60:00</div>
      <div class="paused-badge">Paused</div>
    </div>
  </div>
  <div class="flash" id="flash"></div>

  <!-- Class Trial invitation (the GM's "Invite players"): time stops, then JOIN CLASS TRIAL -->
  <div class="tstop" id="tstop">
    <div class="tst-veil"></div>
    <div class="tst-at" id="tstAt">
      <div class="tst-ring"></div><div class="tst-ring r2"></div>
      <div class="tst-box">
        <div class="tst-await">The court awaits</div>
        <a class="tst-join" id="tstJoin" href="/trial">JOIN CLASS TRIAL</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // Géométrie du verre (viewBox 1024x1536, mesurée sur le cadre FINAL)
    var GT = 382, NECK = 769, GB = 1135, SX = 305, SW = 412, CX = 512;
    var sandTop = document.getElementById('sandTop');
    var sandBot = document.getElementById('sandBot');
    var stream  = document.getElementById('stream');
    var sandG   = document.getElementById('sandG');
    var pg      = document.getElementById('particles');
    var clock   = document.getElementById('clock');
    var page    = document.getElementById('page');
    var flash   = document.getElementById('flash');
    var soundBtn= document.getElementById('soundBtn');
    var NS = "http://www.w3.org/2000/svg";
    var particles = [];
    var lastTs = 0;

    // Sable en forme d'ampoule : surface concave (haut) / monticule (bas)
    function sandPath(surfY, baseY, curve, mound){
      var x0 = SX, x1 = SX + SW;
      var ctrlY = mound ? (surfY - curve) : (surfY + curve);
      return 'M'+x0+','+baseY+' L'+x0+','+surfY+' Q'+CX+','+ctrlY+' '+x1+','+surfY+' L'+x1+','+baseY+' Z';
    }

    // Bouton son : 1er clic = activer, ensuite bascule activé / coupé
    var soundReady = false;
    soundBtn.addEventListener('click', function () {
      if (!soundReady) { unlockAudio(); soundReady = true; soundMuted = false; playAlert('reminder'); }
      else { soundMuted = !soundMuted; if (!soundMuted) { unlockAudio(); playAlert('reminder'); } }
      updateSoundBtn();
    });
    function updateSoundBtn(){
      if (!soundReady) { soundBtn.textContent = '🔔 Enable sound'; soundBtn.classList.remove('off'); }
      else if (soundMuted) { soundBtn.textContent = '🔕 Sound off'; soundBtn.classList.add('off'); }
      else { soundBtn.textContent = '🔊 Sound on'; soundBtn.classList.remove('off'); }
    }

    function doFlash(){ flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }

    function spawnParticle(yFill){
      var c = document.createElementNS(NS,'circle');
      c.setAttribute('r',(2.0+Math.random()*2.0).toFixed(2));
      c.setAttribute('fill','#ffd77a');
      pg.appendChild(c);
      particles.push({el:c, x:CX+(Math.random()*10-5), y:NECK, v:320+Math.random()*160, tgt:yFill});
    }

    function renderSand(rem, s){
      var f = Math.max(0, Math.min(1, 1 - rem / s.totalMs));
      var running = s.running;
      var ySurf = GT + f*(NECK-GT);
      var yFill = GB - f*(GB-NECK);
      var dipT   = Math.min(52, (NECK-ySurf)*0.55);
      var moundB = Math.min(64, (GB-yFill)*0.55);
      sandTop.setAttribute('d', sandPath(ySurf, NECK, dipT, false));
      sandBot.setAttribute('d', sandPath(yFill, GB, moundB, true));

      var flowing = (running || frozen) && f > 0.001 && f < 0.999;   // frozen: the falling sand hangs in the air
      if (flowing){
        stream.setAttribute('y', NECK);
        stream.setAttribute('height', Math.max(0, yFill-NECK));
        stream.style.display = 'block';
      } else { stream.style.display = 'none'; }

      var now = performance.now();
      var dt = lastTs ? Math.min(0.05,(now-lastTs)/1000) : 0; lastTs = now;
      if (frozen) dt = 0;
      if (running && flowing && Math.random() < 0.7) spawnParticle(yFill);
      for (var i=particles.length-1;i>=0;i--){
        var p=particles[i]; p.y += p.v*dt;
        if (p.y >= p.tgt-2 || p.y > GB){ p.el.remove(); particles.splice(i,1); continue; }
        p.el.setAttribute('cx',p.x.toFixed(1)); p.el.setAttribute('cy',p.y.toFixed(1));
      }

      sandG.classList.toggle('danger', rem <= 5*60*1000);
      sandG.classList.toggle('critical', rem <= 60*1000 && rem > 0);
    }

    /* ---------- Horloge de la Citadelle ---------- */
    var ROMAN = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
    var mcHour = document.getElementById('mcHourHand');
    var mcMin  = document.getElementById('mcMinHand');
    var mcTime = document.getElementById('mcTime');
    (function buildClock(){
      var ticks = document.getElementById('mcTicks');
      var nums  = document.getElementById('mcNums');
      var riv   = document.getElementById('mcRivets');
      for (var m = 0; m < 60; m++) {
        var a = (m * 6 - 90) * Math.PI / 180;
        var big = m % 5 === 0;
        var r1 = big ? 62 : 67, r2 = 72;
        var l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', (100 + Math.cos(a) * r1).toFixed(1));
        l.setAttribute('y1', (100 + Math.sin(a) * r1).toFixed(1));
        l.setAttribute('x2', (100 + Math.cos(a) * r2).toFixed(1));
        l.setAttribute('y2', (100 + Math.sin(a) * r2).toFixed(1));
        l.setAttribute('stroke-width', big ? 2.6 : 1);
        l.setAttribute('opacity', big ? 1 : 0.55);
        ticks.appendChild(l);
      }
      for (var h = 0; h < 12; h++) {
        var ah = (h * 30 - 90) * Math.PI / 180;
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('x', (100 + Math.cos(ah) * 52).toFixed(1));
        t.setAttribute('y', (100 + Math.sin(ah) * 52 + 4.6).toFixed(1));
        t.textContent = ROMAN[h];
        nums.appendChild(t);
      }
      for (var k = 0; k < 12; k++) {
        var ar = (k * 30 - 90) * Math.PI / 180;
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', (100 + Math.cos(ar) * 91).toFixed(1));
        c.setAttribute('cy', (100 + Math.sin(ar) * 91).toFixed(1));
        c.setAttribute('r', 2.6);
        riv.appendChild(c);
      }
    })();
    /* Le sablier couvre une heure de fiction : 09:00 -> 10:00. */
    function renderClock(rem, s) {
      var elapsed = Math.max(0, Math.min(s.totalMs, s.totalMs - rem));
      var mins = elapsed / 60000;                    // 0 -> 60
      var hh = 9 + Math.floor(mins / 60);
      var mm = Math.floor(mins) % 60;
      if (mins >= 60) { hh = 10; mm = 0; }
      mcTime.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
      mcMin.setAttribute('transform', 'rotate(' + (mins * 6).toFixed(2) + ' 100 100)');
      mcHour.setAttribute('transform', 'rotate(' + (270 + mins * 0.5).toFixed(2) + ' 100 100)');
    }

    /* ---------- Class Trial invitation ----------
       The GM presses "Invite players" on the trial dashboard: the hourglass is
       paused and, here, time stops — violet flash, a shockwave from the neck,
       the grains freeze in mid-air — then JOIN CLASS TRIAL slams in. It leads to
       /trial, where each player picks their character. */
    var frozen = false, inviteAt = null;
    var tstop = document.getElementById('tstop'), tstAt = document.getElementById('tstAt');
    var badge = document.querySelector('.paused-badge');
    var hgFrame = document.getElementById('hgFrame');
    function placeInvite() {
      var r = hgFrame.getBoundingClientRect();
      tstAt.style.left = (r.left + r.width / 2) + 'px';
      tstAt.style.top = (r.top + r.height * (NECK / 1536)) + 'px';     // right on the glass's neck
    }
    window.addEventListener('resize', placeInvite);
    function playFreeze() {
      if (!soundReady || soundMuted || !audioCtx) return;
      unlockAudio();
      var c = audioCtx, t = c.currentTime;
      // a tape-stop: everything winds down...
      var o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(38, t + 1.25);
      var lp = c.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(160, t + 1.25);
      var g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.35);
      o.connect(lp); lp.connect(g); g.connect(masterGain || c.destination); o.start(t); o.stop(t + 1.4);
      // ...then a deep bell as the invitation lands
      tone(98, 1.2, 2.8, 0.7); tone(147, 1.22, 2.4, 0.45); tone(392, 1.24, 1.6, 0.25, 'triangle');
    }
    function stopTime() {
      placeInvite();
      tstop.classList.remove('intro'); void tstop.offsetWidth; tstop.classList.add('intro');
      page.classList.remove('shake'); void page.offsetWidth; page.classList.add('shake');
      flash.classList.add('violet'); doFlash();
      setTimeout(function () { flash.classList.remove('violet'); }, 950);
      playFreeze();
    }
    function applyInvite(s) {
      var inv = s.invite || { on: false, at: 0 };
      var fresh = inviteAt !== null && inv.at !== inviteAt && inv.on && (s.serverNow - inv.at) < 15000;
      inviteAt = inv.at;
      var wasFrozen = frozen;
      frozen = !!inv.on && !s.running;
      page.classList.toggle('frozen', frozen);
      sandG.classList.toggle('frozen', frozen);
      if (frozen && !wasFrozen) particles.forEach(function (p) { p.el.style.animationDelay = (-Math.random() * 1.4).toFixed(2) + 's'; });
      badge.textContent = frozen ? 'Time stands still' : 'Paused';
      if (inv.on && !tstop.classList.contains('on')) placeInvite();
      tstop.classList.toggle('on', !!inv.on);
      if (!inv.on) tstop.classList.remove('intro');
      if (fresh) stopTime();
    }

    startSync({
      onState: function (s) { page.classList.toggle('paused', !s.running); applyInvite(s); },
      onFrame: function (rem, s) { renderSand(rem, s); renderClock(rem, s); clock.textContent = fmt(rem); },
      onEvent: function (e) {
        if (e.kind === 'timer' || e.kind === 'end') { playAlert(e.kind); doFlash(); }
      },
    });
  </script>
</body>
</html>
